[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webpage-journey"
dynamic = ["version"]
description = "Trace a webpage request end to end and map it onto the OSI model."
requires-python = ">=3.13"
dependencies = [
    "rich",
    "dnspython",
]

[project.optional-dependencies]
certs = ["cryptography>=42.0"]

[project.scripts]
webpage-journey = "wj.cli:main"

[tool.setuptools.dynamic]
version = {attr = "wj.__version__"}

[tool.setuptools.packages.find]
include = ["wj", "wj.collect"]
exclude = ["tests", "tests.*", "docs", "docs.*"]
